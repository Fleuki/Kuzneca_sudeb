# Сборка и публикация игры на GitHub Pages.
#
# В git лежит только исходный код: собранный бандл создаётся здесь на каждый
# пуш в main и уезжает прямо в Pages, минуя репозиторий.
#
# Источник публикации переключается на «GitHub Actions» самим workflow
# (enablement: true у configure-pages), руками в настройках лезть не нужно.

name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои друг друга перебивают, поэтому очередь из одного.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      # Детерминизм — несущее требование §11: если он сломан, балансировка
      # ботами перестаёт быть воспроизводимой. Пусть падает в CI, а не на плейтесте.
      - name: Проверка детерминизма
        run: npm run determinism

      # Комнаты рисуются руками, и недосягаемая платформа выглядит в тексте так же,
      # как достижимая. Пусть это ловит CI, а не игрок на плейтесте.
      - name: Проходимость шахты
        run: npm run mine-check

      # Забег не должен приводить в положение, из которого нет выхода.
      - name: Проверка тупиков
        run: npm run deadlock-check

      # Нажатие должно давать ожидаемый результат: тап берёт ступеньку,
      # зажатая кнопка бьёт повторно.
      - name: Отзывчивость управления
        run: npm run input-check

      # Заморозка кадра, отскок и отбрасывание делаются «на ощупь», и любая
      # правка чисел легко превращает удар в вату или в рваный бой.
      - name: Ощущение удара
        run: npm run feel-check

      # Звук читает состояние так же, как рендер. Ошибки тут тихие: звук просто
      # пропадает или начинает трещать каждый кадр, и по коду это не видно.
      - name: Звуковой слой
        run: npm run audio-check

      - name: Сборка
        run: npm run build

      # enablement: true переводит Pages с публикации из ветки на публикацию
      # из Actions. Без этого сборка из main:/docs продолжает перебивать наш
      # деплой, а в той папке лежит только дизайн-документ — отсюда 404 в корне.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
