<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0b0e'/%3E%3Cpath d='M6 13h20l-4 5H10z' fill='%23c8a24a'/%3E%3Crect x='12' y='18' width='8' height='4' fill='%23c8a24a'/%3E%3Crect x='8' y='22' width='16' height='4' rx='1' fill='%23e07a35'/%3E%3C/svg%3E" />
    <title>Кузнец Судеб</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0d;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c8a24a;
        font-size: 20px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        pointer-events: none;
        transition: opacity 0.4s;
      }
      #boot.hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">Разжигаем горн…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
